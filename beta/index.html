<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="GigTracker BETA">
<meta name="theme-color" content="#92400e">
<title>GigTracker BETA</title>
<link rel="manifest" href="manifest.json">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#fff;--bg2:#f4f4f5;--bg3:#e4e4e7;
  --t:#18181b;--t2:#71717a;--t3:#a1a1aa;
  --bdr:rgba(0,0,0,.1);--bdr2:rgba(0,0,0,.18);
  --grn:#16a34a;--red:#dc2626;--blu:#2563eb;--amb:#d97706;
  --grn-bg:#f0fdf4;--red-bg:#fef2f2;--blu-bg:#eff6ff;--amb-bg:#fffbeb;
  --grn-t:#15803d;--red-t:#b91c1c;--blu-t:#1d4ed8;--amb-t:#92400e
}
@media(prefers-color-scheme:dark){:root{
  --bg:#18181b;--bg2:#27272a;--bg3:#3f3f46;
  --t:#fafafa;--t2:#a1a1aa;--t3:#71717a;
  --bdr:rgba(255,255,255,.1);--bdr2:rgba(255,255,255,.2);
  --grn:#4ade80;--red:#f87171;--blu:#60a5fa;--amb:#fbbf24;
  --grn-bg:#052e16;--red-bg:#450a0a;--blu-bg:#172554;--amb-bg:#451a03;
  --grn-t:#4ade80;--red-t:#f87171;--blu-t:#93c5fd;--amb-t:#fbbf24
}}
html,body{height:100%;background:var(--bg2);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--t)}
#app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;background:var(--bg);display:flex;flex-direction:column}
/* Topbar */
.topbar{display:flex;justify-content:space-between;align-items:center;padding:13px 16px;border-bottom:.5px solid var(--bdr);background:var(--bg);position:sticky;top:0;z-index:10;flex-shrink:0}
.topbar-title{font-size:16px;font-weight:700}
.topbar-r{display:flex;align-items:center;gap:10px}
.bk-dot{width:8px;height:8px;border-radius:50%;background:var(--grn);flex-shrink:0;transition:background .3s}
.bk-dot.warn{background:var(--amb)}
.bk-dot.never{background:var(--t3)}
.icon-btn{background:none;border:none;color:var(--t2);cursor:pointer;font-size:20px;line-height:1;padding:2px}
/* Content & tabs */
.content{flex:1;padding:14px 16px 0;overflow-y:auto}
.tabs{display:flex;border-top:.5px solid var(--bdr);background:var(--bg);flex-shrink:0;padding-bottom:env(safe-area-inset-bottom)}
.tb{flex:1;padding:10px 4px 9px;background:none;border:none;border-top:2px solid transparent;color:var(--t2);cursor:pointer;font-size:13px;font-family:inherit;font-weight:500}
.tb.active{color:var(--blu-t);border-top-color:var(--blu)}
/* Forms */
label{display:block;font-size:12px;color:var(--t2);margin:12px 0 4px;font-weight:500}
input,textarea,select{width:100%;padding:10px 12px;border:.5px solid var(--bdr2);border-radius:8px;font-size:16px;background:var(--bg2);color:var(--t);font-family:inherit;outline:none;appearance:none;-webkit-appearance:none}
input:focus,textarea:focus{border-color:var(--blu);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
textarea{resize:vertical;min-height:60px;font-size:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* Location combobox */
.combo-wrap{position:relative;display:flex;gap:6px}
.star-btn{flex-shrink:0;width:46px;border:.5px solid var(--bdr2);border-radius:8px;background:none;font-size:19px;line-height:1;cursor:pointer;color:var(--t2);font-family:inherit}
.star-btn:active{opacity:.8}
.combo-list{position:absolute;left:0;right:52px;top:100%;margin-top:4px;background:var(--bg);border:.5px solid var(--bdr2);border-radius:8px;max-height:190px;overflow-y:auto;box-shadow:0 4px 14px rgba(0,0,0,.15);z-index:20}
.combo-item{padding:9px 12px;font-size:13px;cursor:pointer;border-bottom:.5px solid var(--bdr)}
.combo-item:last-child{border-bottom:none}
.combo-item:active{background:var(--bg2)}
.combo-item .ci-addr{font-size:11px;color:var(--t3);margin-top:1px}
.addr-link{color:var(--blu-t);text-decoration:none;font-weight:600}
/* Type buttons */
.type-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:4px}
.tbtn{padding:10px 4px;border:.5px solid var(--bdr2);border-radius:8px;background:none;color:var(--t2);cursor:pointer;font-size:12px;font-family:inherit;text-align:center;line-height:1.4;font-weight:500}
.tbtn.sel-i{background:var(--grn-bg);color:var(--grn-t);border-color:var(--grn);font-weight:700}
.tbtn.sel-r{background:var(--blu-bg);color:var(--blu-t);border-color:var(--blu);font-weight:700}
.tbtn.sel-e{background:var(--red-bg);color:var(--red-t);border-color:var(--red);font-weight:700}
/* Toggles */
.tgl{border:.5px solid var(--bdr);border-radius:8px;padding:10px 12px;margin-top:10px}
.tgl-hdr{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.tgl-hdr input[type=checkbox]{width:18px;height:18px;cursor:pointer;accent-color:var(--blu);flex-shrink:0;margin:0}
.tgl-hdr span{font-size:14px}
.tgl-body{display:none;margin-top:10px}.tgl-body.open{display:block}
/* Buttons */
.btn{display:block;width:100%;padding:14px;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;border:none;margin-top:14px}
.btn:active{opacity:.82;transform:scale(.99)}
.btn-i{background:var(--grn);color:#fff}
.btn-r{background:var(--blu);color:#fff}
.btn-e{background:var(--red);color:#fff}
.btn-b{background:var(--blu);color:#fff}
.btn-n{background:var(--bg2);color:var(--t);border:.5px solid var(--bdr2)}
.btn-cancel{background:none;color:var(--t2);border:.5px solid var(--bdr2);margin-top:8px}
/* Preview box */
.preview{background:var(--bg2);border:.5px solid var(--bdr2);border-radius:10px;padding:12px;margin-top:14px}
.prev-hdr{font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;font-weight:600}
.prow{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;padding:2px 0}
.pl{color:var(--t2)}.pv{font-weight:600;text-align:right;padding-left:8px}
/* Cards */
.card{border:.5px solid var(--bdr);border-radius:12px;padding:12px 14px;margin-bottom:10px;background:var(--bg)}
.card.editing{border-color:var(--blu);border-width:1.5px}
.card-hdr{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.card-name{font-size:14px;font-weight:600;line-height:1.3}
.card-date{font-size:12px;color:var(--t3);margin-top:2px}
.card-amt{font-size:19px;font-weight:700;white-space:nowrap;flex-shrink:0}
.card-meta{display:flex;gap:5px;flex-wrap:wrap;margin:7px 0 4px}
.pill{font-size:11px;padding:2px 8px;border-radius:99px;font-weight:600}
.pill-income{background:var(--grn-bg);color:var(--grn-t)}
.pill-expense{background:var(--red-bg);color:var(--red-t)}
.pill-rehearsal{background:var(--blu-bg);color:var(--blu-t)}
.pill-n{background:var(--bg2);color:var(--t2);border:.5px solid var(--bdr)}
.pill-edit{background:var(--blu-bg);color:var(--blu-t)}
.card-acts{display:flex;gap:6px;margin-top:10px}
.abt{flex:1;padding:7px;border:.5px solid var(--bdr2);border-radius:7px;background:none;color:var(--t2);cursor:pointer;font-size:12px;font-family:inherit;font-weight:500}
.abt-edit{color:var(--blu-t);border-color:rgba(37,99,235,.3)}
.abt-del{color:var(--red-t);border-color:rgba(220,38,38,.3)}
/* Detail rows */
.detail{margin-top:10px;border-top:.5px solid var(--bdr);padding-top:10px}
.drow{display:flex;justify-content:space-between;font-size:12px;padding:2px 0}
.dl{color:var(--t2)}.dv{font-weight:600;text-align:right;padding-left:6px}
.dsec{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--t3);margin:8px 0 3px;font-weight:700}
/* Metric grid */
.mg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.mg3{grid-template-columns:repeat(3,1fr)}
.mt{background:var(--bg2);border-radius:8px;padding:12px 8px;text-align:center}
.ml{font-size:10px;color:var(--t3);margin-bottom:4px;line-height:1.3;font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.mv{font-size:17px;font-weight:700}
/* Filters */
.filter-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.fbtn{padding:6px 14px;border:.5px solid var(--bdr2);border-radius:99px;background:none;color:var(--t2);cursor:pointer;font-size:12px;font-family:inherit;font-weight:600}
.fbtn.active{background:var(--blu-bg);color:var(--blu-t);border-color:var(--blu)}
/* Callouts */
.callout{border-radius:8px;padding:10px 12px;font-size:13px;line-height:1.6;margin:10px 0}
.c-info{background:var(--blu-bg);color:var(--blu-t);border:.5px solid rgba(37,99,235,.25)}
.c-warn{background:var(--amb-bg);color:var(--amb-t);border:.5px solid rgba(217,119,6,.25)}
.c-success{background:var(--grn-bg);color:var(--grn-t);border:.5px solid rgba(22,163,74,.25)}
/* Colors */
.val-g{color:var(--grn-t)}.val-r{color:var(--red-t)}.val-a{color:var(--amb-t)}.val-b{color:var(--blu-t)}
/* Misc */
.sep{height:.5px;background:var(--bdr);margin:12px 0}
.sec{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--t3);margin:16px 0 8px}
.note{font-size:12px;color:var(--t3);line-height:1.5;margin-top:4px}
.empty{text-align:center;color:var(--t3);padding:48px 20px;font-size:14px;line-height:1.8}
.back-btn{background:none;border:none;color:var(--blu-t);cursor:pointer;font-size:14px;font-family:inherit;padding:0;font-weight:600;margin-bottom:12px;display:block}
.edit-banner{background:var(--blu-bg);border:.5px solid rgba(37,99,235,.3);border-radius:8px;padding:10px 14px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.edit-banner span{font-size:13px;color:var(--blu-t);font-weight:600}
.edit-banner button{background:none;border:none;color:var(--blu-t);cursor:pointer;font-size:18px;padding:0;line-height:1}
/* Summary hero */
.hero{background:var(--bg);border:.5px solid var(--bdr);border-radius:14px;padding:20px;margin-bottom:12px}
.hero-lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--t3);margin-bottom:14px}
.wf-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:.5px solid var(--bdr)}
.wf-row:last-child{border-bottom:none}
.wf-lbl{font-size:14px;color:var(--t2)}.wf-amt{font-size:15px;font-weight:700}
.wf-total{border-top:1.5px solid var(--bdr)!important;margin-top:4px;padding-top:10px!important}
.wf-total .wf-lbl{font-size:16px;font-weight:700;color:var(--t)}.wf-total .wf-amt{font-size:22px}
.bar-track{height:8px;border-radius:99px;background:var(--bg3);overflow:hidden;margin:14px 0 6px;display:flex}
.bar-seg{height:100%}
.bar-leg{display:flex;gap:10px;flex-wrap:wrap}
.bleg{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--t2)}
.bleg-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.hr-hero{text-align:center;padding:14px 0 4px;border-top:.5px solid var(--bdr);margin-top:10px}
.hr-val{font-size:28px;font-weight:700}
.hr-lbl{font-size:12px;color:var(--t3);margin-top:2px}
/* Accordion */
.acc{border:.5px solid var(--bdr);border-radius:12px;margin-bottom:10px;overflow:hidden}
.acc-hdr{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;cursor:pointer;user-select:none;background:var(--bg)}
.acc-hdr:active{background:var(--bg2)}
.acc-title{font-size:14px;font-weight:600}
.acc-r{display:flex;align-items:center;gap:8px}
.acc-val{font-size:13px;font-weight:700;color:var(--t2)}
.acc-arrow{font-size:11px;color:var(--t3);display:inline-block;transition:transform .2s}
.acc-arrow.open{transform:rotate(180deg)}
.acc-body{display:none;padding:0 16px 14px;border-top:.5px solid var(--bdr)}
.acc-body.open{display:block}
/* Schedule C rows */
.srow{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;border-bottom:.5px solid var(--bdr)}
.srow:last-child{border-bottom:none}
.sl{color:var(--t2)}.sv{font-weight:600;text-align:right}
/* Quarterly */
.qgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.qcard{background:var(--bg2);border-radius:8px;padding:10px;text-align:center}
.qdate{font-size:11px;color:var(--t3);margin-bottom:3px;font-weight:600}
.qamt{font-size:16px;font-weight:700;color:var(--amb-t)}
/* Per-gig */
.grow{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:.5px solid var(--bdr)}
.grow:last-child{border-bottom:none}
.gl{font-size:13px}.gd{font-size:11px;color:var(--t3);margin-top:1px}
.gr{text-align:right;flex-shrink:0;padding-left:8px}
.gamt{font-size:13px;font-weight:700}.ghr{font-size:11px}
/* Backup / settings */
.bk-card{border:.5px solid var(--bdr);border-radius:10px;padding:14px;margin-bottom:10px}
.bk-row{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--t2);padding:3px 0}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="topbar-title">🧪 GigTracker BETA</div>
    <div class="topbar-r">
      <span class="bk-dot never" id="bk-dot" title="Tap ⚙ to export a backup"></span>
      <button class="icon-btn" id="locations-btn" onclick="openLocations()" title="Saved locations">📍</button>
      <button class="icon-btn" id="settings-btn" onclick="openSettings()" title="Settings &amp; backup">⚙</button>
    </div>
  </div>
  <div class="content" id="mc"><div class="empty">Loading…</div></div>
  <div class="tabs" id="tabs">
    <button class="tb active" id="tab-add" onclick="switchTab('add')">+ Add</button>
    <button class="tb" id="tab-log" onclick="switchTab('log')">Log</button>
    <button class="tb" id="tab-summary" onclick="switchTab('summary')">Summary</button>
  </div>
</div>

<script>
'use strict';

// ═══════════════════════════════════════════════════════
// INDEXEDDB  — all data lives here, on this device
// ═══════════════════════════════════════════════════════
let _idb = null;
async function openIDB() {
  if (_idb) return _idb;
  return new Promise((res, rej) => {
    const r = indexedDB.open('GigTrackerDB_beta', 2); // isolated from production data — same origin, different DB name
    r.onupgradeneeded = e => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains('recs'))      d.createObjectStore('recs', {keyPath:'id'});
      if (!d.objectStoreNames.contains('kv'))        d.createObjectStore('kv',  {keyPath:'k'});
      if (!d.objectStoreNames.contains('locations')) d.createObjectStore('locations', {keyPath:'id'});
    };
    r.onblocked = () => console.warn('IndexedDB upgrade blocked — close other open tabs of this app.');
    r.onsuccess = e => {
      _idb = e.target.result;
      _idb.onversionchange = () => { _idb.close(); _idb = null; };
      res(_idb);
    };
    r.onerror   = () => rej(r.error);
  });
}
async function iGet(store, key) {
  const db = await openIDB();
  return new Promise((res, rej) => {
    const req = db.transaction(store,'readonly').objectStore(store).get(key);
    req.onsuccess = () => res(req.result);
    req.onerror   = () => rej(req.error);
  });
}
async function iPut(store, val) {
  const db = await openIDB();
  return new Promise((res, rej) => {
    const req = db.transaction(store,'readwrite').objectStore(store).put(val);
    req.onsuccess = () => res();
    req.onerror   = () => rej(req.error);
  });
}
async function iAll(store) {
  const db = await openIDB();
  return new Promise((res, rej) => {
    const req = db.transaction(store,'readonly').objectStore(store).getAll();
    req.onsuccess = () => res(req.result || []);
    req.onerror   = () => rej(req.error);
  });
}
async function iDelete(store, key) {
  const db = await openIDB();
  return new Promise((res, rej) => {
    const req = db.transaction(store,'readwrite').objectStore(store).delete(key);
    req.onsuccess = () => res();
    req.onerror   = () => rej(req.error);
  });
}
const kvGet = k => iGet('kv', k).then(r => r != null ? r.v : null);
const kvSet = (k, v) => iPut('kv', {k, v});

async function recsGetAll() {
  const all = await iAll('recs');
  return all.filter(r => !r.deleted).sort((a,b) => (b.date||'').localeCompare(a.date||''));
}
async function recSave(r) {
  r.updatedAt = new Date().toISOString();
  await iPut('recs', r);
}
async function recMarkDeleted(id) {
  const r = await iGet('recs', id);
  if (r) { r.deleted = true; r.updatedAt = new Date().toISOString(); await iPut('recs', r); }
}

// ═══════════════════════════════════════════════════════
// SAVED LOCATIONS  — separate store, plain convenience list
// (records snapshot their own name/address/miles at save time —
// editing or deleting a saved location never touches past records)
// ═══════════════════════════════════════════════════════
let savedLocations = [];
async function loadSavedLocations() {
  savedLocations = (await iAll('locations')).sort((a,b) => (a.name||'').localeCompare(b.name||''));
}
async function locSave(loc) {
  loc.updatedAt = new Date().toISOString();
  await iPut('locations', loc);
  await loadSavedLocations();
}

// ═══════════════════════════════════════════════════════
// BACKUP REMINDER
// ═══════════════════════════════════════════════════════
async function updateBackupDot() {
  const last = await kvGet('lastBackupAt');
  const dot  = document.getElementById('bk-dot');
  if (!dot) return;
  if (!last) {
    dot.className = 'bk-dot never';
    dot.title = 'No backup yet — export from ⚙ Settings';
    return;
  }
  const days = (Date.now() - new Date(last).getTime()) / 86400000;
  if (days > 14) {
    dot.className = 'bk-dot warn';
    dot.title = `Last backup ${Math.floor(days)} days ago — consider exporting`;
  } else {
    dot.className = 'bk-dot';
    dot.title = `Last backup: ${new Date(last).toLocaleDateString()}`;
  }
}

// ═══════════════════════════════════════════════════════
// APP STATE
// ═══════════════════════════════════════════════════════
let activeTab    = 'log';
let inSettings   = false;
let inLocations  = false;
let editingLocId = null;
let expandedId = null;
let logFilter  = 'all';
let editId     = null;
let openAcc    = new Set(['taxes']);
let cfg = {federalRate:24, stateRate:0, irsRate:0.725, trueCostRate:0.50, mpg:28};
let f   = emptyForm();

function emptyForm() {
  return {
    date:'', payDate:'', type:'income', desc:'', amount:'', payMethod:'',
    locationName:'', address:'',
    notes:'', start:'', end:'',
    hasToll:false,  tollCost:'',
    hasMeal:false,  mealCost:'',
    hasOther:false, otherDesc:'', otherCost:'',
    hasRoom:false,  roomCost:'',
    hasTips:false,  tipsAmount:'', tipsInTax:true,
    miles:'', gasPrice:'',
  };
}
function todayStr() { return new Date().toISOString().split('T')[0]; }

// ═══════════════════════════════════════════════════════
// TAX CALCULATIONS
// ═══════════════════════════════════════════════════════
function calc(fm, s) {
  const base   = parseFloat(fm.amount)   || 0;
  const tips   = fm.hasTips ? parseFloat(fm.tipsAmount) || 0 : 0;
  const toll   = fm.hasToll ? parseFloat(fm.tollCost)   || 0 : 0;
  const meal   = fm.hasMeal ? parseFloat(fm.mealCost)   || 0 : 0;
  const oth    = fm.hasOther ? parseFloat(fm.otherCost) || 0 : 0;
  const room   = fm.hasRoom ? parseFloat(fm.roomCost)   || 0 : 0;
  const miles  = parseFloat(fm.miles)    || 0;
  const gasP   = parseFloat(fm.gasPrice) || 0;
  const mpg    = parseFloat(s.mpg)       || 28;
  const fedR   = parseFloat(s.federalRate) || 24;
  const stR    = parseFloat(s.stateRate)   || 0;
  const irsR   = parseFloat(s.irsRate)     || 0.725;
  const trueR  = parseFloat(s.trueCostRate)|| 0.50;
  const tipsInTax = fm.tipsInTax !== false;

  // Hours
  let hours = 0;
  if (fm.start && fm.end) {
    const tm = t => { const [h,m] = t.split(':').map(Number); return h*60+m; };
    let d = tm(fm.end) - tm(fm.start); if (d < 0) d += 1440; hours = d / 60;
  }

  const fuelCost      = (miles > 0 && mpg > 0) ? (miles/mpg)*gasP : 0;
  const trueCostMiles = miles * trueR;
  const irsDed        = miles * irsR;
  const dedMeals      = meal * 0.5;                    // 50% deductible
  const totalDed      = irsDed + toll + dedMeals + oth + room;
  const combRate      = (fedR + stR) / 100;
  const trueCosts     = trueCostMiles + toll + meal + oth + room;
  const taxSavings    = totalDed * combRate;

  // Total income (tips always add to gross; taxable depends on checkbox)
  const totalIncome   = base + tips;
  const taxableIncome = base + (tipsInTax ? tips : 0);

  let seTax = 0, incomeTax = 0;
  if (fm.type === 'income' && totalIncome > 0) {
    const netSE = Math.max(0, taxableIncome - totalDed);
    seTax       = netSE * 0.9235 * 0.153;   // IRS SE formula
    incomeTax   = Math.max(0, netSE - seTax * 0.5) * combRate;
  }

  const totalTax    = seTax + incomeTax;
  const netAfterAll = totalIncome - trueCosts - totalTax;
  const grossHourly = hours > 0 ? totalIncome / hours : null;
  const trueHourly  = hours > 0 ? netAfterAll / hours : null;

  return {hours, fuelCost, trueCostMiles, irsDed, dedMeals, totalDed, taxSavings,
    trueCosts, seTax, incomeTax, totalTax, netAfterAll,
    grossHourly, trueHourly, toll, meal, oth, room, tips, miles, totalIncome, base};
}

// ═══════════════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════════════
function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function c$(n) { return '$' + Math.abs(n ?? 0).toFixed(2); }
function pm(n) { return (n >= 0 ? '+$' : '-$') + Math.abs(n).toFixed(2); }
function fd(d) { if (!d) return ''; const [y,m,dy] = d.split('-'); return `${m}/${dy}/${y.slice(2)}`; }
function newId() { return crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2); }
function prow(l, v, cls) { return `<div class="prow"><span class="pl">${l}</span><span class="pv${cls?' val-'+cls:''}">${v}</span></div>`; }

// Address → "open in maps" link. No backend/geocoding — picks the scheme
// most likely to hand off to the phone's own nav app per platform.
function isIOS() {
  return /iP(hone|ad|od)/.test(navigator.platform) ||
    (navigator.userAgent.includes('Mac') && navigator.maxTouchPoints > 1);
}
function mapsUrl(address) {
  const q = encodeURIComponent(String(address||'').trim());
  if (!q) return '';
  if (isIOS()) return `https://maps.apple.com/?q=${q}`;
  if (/Android/i.test(navigator.userAgent)) return `geo:0,0?q=${q}`;
  return `https://www.google.com/maps/search/?api=1&query=${q}`;
}
function mapsLinkHTML(address) {
  const url = mapsUrl(address);
  if (!url) return esc(address||'');
  return `<a class="addr-link" href="${url}" target="_blank" rel="noopener">📍 ${esc(address)}</a>`;
}

// RENDER ROUTER
// ═══════════════════════════════════════════════════════
async function render() {
  if (inSettings) {
    document.getElementById('tabs').style.display = 'none';
    await renderSettings();
    return;
  }
  if (inLocations) {
    document.getElementById('tabs').style.display = 'none';
    await renderLocations();
    return;
  }
  document.getElementById('tabs').style.display = 'flex';
  const at = document.getElementById('tab-add');
  if (at) at.textContent = editId ? '✏ Edit' : '+ Add';
  document.querySelectorAll('.tb').forEach(b => b.classList.toggle('active', b.id === 'tab-' + activeTab));
  if (activeTab === 'add')         await renderAdd();
  else if (activeTab === 'log')    await renderLog();
  else                             await renderSummary();
}

function upPrev() {
  const box = document.getElementById('lprev');
  if (!box) return;
  const isI = f.type === 'income', isR = f.type === 'rehearsal';
  const p = calc(f, cfg);
  const hasIncome = (parseFloat(f.amount)||0) > 0 || p.tips > 0;
  if (!hasIncome && !p.trueCosts && !p.hours) { box.innerHTML = ''; return; }
  let rows = '';
  if (p.hours > 0)       rows += prow('Duration', p.hours.toFixed(2)+' hrs', '');
  if (p.tips > 0)        rows += prow('Tips'+(f.tipsInTax!==false?' (taxed)':' (not taxed)'), c$(p.tips), f.tipsInTax!==false?'r':'a');
  if (p.totalIncome > p.base && p.base > 0) rows += prow('Total income', c$(p.totalIncome), 'g');
  if (p.miles > 0)       rows += prow(`IRS deduction ($${cfg.irsRate}/mi)`, c$(p.irsDed), 'g');
  if (p.meal > 0)        rows += prow('Meal (50% ded.)', c$(p.meal)+' → '+c$(p.dedMeals)+' deducted', '');
  if (p.room > 0)        rows += prow('Room rental (100% ded.)', c$(p.room), 'g');
  if (p.trueCosts > 0)   rows += prow('Total out-of-pocket', c$(p.trueCosts), 'r');
  if (p.taxSavings > 0)  rows += prow('Est. tax savings', c$(p.taxSavings), 'g');
  if (isI && p.seTax > 0)      rows += prow('SE tax (15.3%)', c$(p.seTax), 'r');
  if (isI && p.incomeTax > 0)  rows += prow(`Income tax (${parseFloat(cfg.federalRate)+parseFloat(cfg.stateRate)}%)`, c$(p.incomeTax), 'r');
  if (isI && hasIncome) {
    rows += '<div class="sep" style="margin:5px 0"></div>';
    rows += prow('Net after costs + taxes', pm(p.netAfterAll), p.netAfterAll>=0?'g':'r');
    if (p.grossHourly !== null && p.hours > 0)
      rows += prow('Rate (auto)', `${c$(p.grossHourly)}/hr gross — ${pm(p.trueHourly)}/hr true`, '');
  }
  if (isR && p.hours > 0) {
    rows += '<div class="sep" style="margin:5px 0"></div>';
    rows += prow('Cost of rehearsal', c$(p.trueCosts)+' / '+p.hours.toFixed(1)+' hrs', 'a');
  }
  box.innerHTML = rows ? `<div class="preview"><div class="prev-hdr">Preview</div>${rows}</div>` : '';
}

// ═══════════════════════════════════════════════════════
// LOCATION COMBOBOX (type-or-select) + star-save
// Updates isolated child nodes only — never calls the full render() —
// so the on-screen keyboard and input focus survive every keystroke/tap.
// ═══════════════════════════════════════════════════════
function onLocationInput(val) {
  f.locationName = val;
  const box = document.getElementById('loc-suggest');
  if (!box) return;
  const q = val.trim().toLowerCase();
  const matches = (q ? savedLocations.filter(l => l.name.toLowerCase().includes(q)) : savedLocations).slice(0, 8);
  if (matches.length === 0) { box.innerHTML = ''; return; }
  box.innerHTML = `<div class="combo-list">${matches.map(l => `
    <div class="combo-item" onmousedown="event.preventDefault()" onclick="pickLocation('${l.id}')">
      <div>${esc(l.name)}</div>
      ${l.address ? `<div class="ci-addr">${esc(l.address)}</div>` : ''}
    </div>`).join('')}</div>`;
}

function pickLocation(id) {
  const loc = savedLocations.find(l => l.id === id);
  if (!loc) return;
  f.locationName = loc.name;
  f.address      = loc.address || '';
  if (loc.miles) f.miles = String(loc.miles);

  const nameEl  = document.getElementById('loc-name-input');
  const addrEl  = document.getElementById('loc-address-input');
  const milesEl = document.getElementById('f-miles');
  if (nameEl)  nameEl.value  = f.locationName;
  if (addrEl)  addrEl.value  = f.address;
  if (milesEl) milesEl.value = f.miles;

  const box = document.getElementById('loc-suggest');
  if (box) box.innerHTML = '';
  upPrev();
}

async function saveCurrentLocation() {
  const name = (f.locationName || '').trim();
  if (!name) { alert('Enter a location name first.'); return; }
  const existing = savedLocations.find(l => l.name.toLowerCase() === name.toLowerCase());
  const loc = existing
    ? {...existing, name, address: f.address || '', miles: parseFloat(f.miles) || 0}
    : {id: newId(), name, address: f.address || '', miles: parseFloat(f.miles) || 0, createdAt: new Date().toISOString()};
  await locSave(loc);
  const btn = document.getElementById('star-btn');
  if (btn) {
    btn.textContent = '✓';
    setTimeout(() => { const b = document.getElementById('star-btn'); if (b) b.textContent = '☆'; }, 1200);
  }
}

function toggleAcc(id) { if (openAcc.has(id)) openAcc.delete(id); else openAcc.add(id); renderSummary(); }
function accSection(id, title, badge, body) {
  const open = openAcc.has(id);
  return `<div class="acc">
    <div class="acc-hdr" onclick="toggleAcc('${id}')">
      <span class="acc-title">${title}</span>
      <span class="acc-r">
        ${badge ? `<span class="acc-val">${badge}</span>` : ''}
        <span class="acc-arrow ${open?'open':''}">▼</span>
      </span>
    </div>
    <div class="acc-body ${open?'open':''}">${body}</div>
  </div>`;
}

async function renderSummary() {
  const yr   = new Date().getFullYear().toString();
  const all  = await recsGetAll();
  const yR   = all.filter(r => r.date && r.date.startsWith(yr));
  const iR   = yR.filter(r => r.type === 'income');
  const rehR = yR.filter(r => r.type === 'rehearsal');
  const expR = yR.filter(r => r.type === 'expense');
  const sum  = (arr, key) => arr.reduce((s,r) => s + (r[key]||0), 0);

  const gross    = sum(iR, 'amount');
  const tips     = sum(iR, 'tips');
  const totalInc = gross + tips;
  const gigCosts = sum(iR, 'trueCosts');
  const rehCosts = sum(rehR, 'trueCosts');
  const expCosts = sum(expR, 'amount');
  const allCosts = gigCosts + rehCosts + expCosts;
  const totalDed = sum(yR, 'totalDed');
  const seTax    = sum(iR, 'seTax');
  const incTax   = sum(iR, 'incomeTax');
  const taxSav   = sum(yR, 'taxSavings');
  const miles    = sum(yR, 'miles');
  const gigHrs   = sum(iR, 'hours');
  const rehHrs   = sum(rehR, 'hours');
  const totalTax = seTax + incTax;
  const net      = totalInc - allCosts - totalTax;
  const allHrs   = gigHrs + rehHrs;
  const realHr   = allHrs > 0 ? net / allHrs : null;

  const pct = v => totalInc > 0 ? Math.max(0, Math.min(100, v/totalInc*100)).toFixed(1) : '0';
  const costP = pct(allCosts), taxP = pct(totalTax), keptP = pct(Math.max(0, net));

  const hero = `<div class="hero">
    <div class="hero-lbl">${yr} at a glance</div>
    <div class="wf-row"><span class="wf-lbl">Base pay</span><span class="wf-amt val-g">+${c$(gross)}</span></div>
    ${tips > 0 ? `<div class="wf-row"><span class="wf-lbl">Tips</span><span class="wf-amt val-g">+${c$(tips)}</span></div>
    <div class="wf-row"><span class="wf-lbl">Total income</span><span class="wf-amt val-g">+${c$(totalInc)}</span></div>` : ''}
    <div class="wf-row"><span class="wf-lbl">Business expenses</span><span class="wf-amt val-r">-${c$(allCosts)}</span></div>
    <div class="wf-row"><span class="wf-lbl">Estimated taxes</span><span class="wf-amt val-r">-${c$(totalTax)}</span></div>
    <div class="wf-row wf-total"><span class="wf-lbl">You kept</span><span class="wf-amt ${net>=0?'val-g':'val-r'}">${pm(net)}</span></div>
    ${totalInc > 0 ? `
    <div class="bar-track">
      <div class="bar-seg" style="width:${costP}%;background:var(--red)"></div>
      <div class="bar-seg" style="width:${taxP}%;background:var(--amb)"></div>
      <div class="bar-seg" style="width:${keptP}%;background:var(--grn)"></div>
    </div>
    <div class="bar-leg">
      <span class="bleg"><span class="bleg-dot" style="background:var(--red)"></span>Expenses ${costP}%</span>
      <span class="bleg"><span class="bleg-dot" style="background:var(--amb)"></span>Taxes ${taxP}%</span>
      <span class="bleg"><span class="bleg-dot" style="background:var(--grn)"></span>Kept ${keptP}%</span>
    </div>` : ''}
    ${realHr !== null ? `
    <div class="hr-hero">
      <div class="hr-val ${realHr>=0?'val-g':'val-r'}">${c$(realHr)}/hr</div>
      <div class="hr-lbl">true effective hourly rate (net ÷ all musician hours)</div>
    </div>` : ''}
  </div>`;

  const taxBody = `<div style="padding-top:10px">
    <div class="dsec">Estimated taxes owed</div>
    <div class="drow"><span class="dl">SE tax (income × 0.9235 × 15.3%)</span><span class="dv val-r">${c$(seTax)}</span></div>
    <div class="drow"><span class="dl">Income tax (${parseFloat(cfg.federalRate)+parseFloat(cfg.stateRate)}% bracket)</span><span class="dv val-r">${c$(incTax)}</span></div>
    <div class="drow"><span class="dl">Total tax burden</span><span class="dv val-r">${c$(totalTax)}</span></div>
    <div class="drow"><span class="dl">Tax savings via deductions</span><span class="dv val-g">${c$(taxSav)}</span></div>
    <div class="dsec" style="margin-top:12px">Quarterly estimated payments</div>
    <div class="qgrid">
      <div class="qcard"><div class="qdate">Q1 — Apr 15</div><div class="qamt">${c$(totalTax/4)}</div></div>
      <div class="qcard"><div class="qdate">Q2 — Jun 16</div><div class="qamt">${c$(totalTax/4)}</div></div>
      <div class="qcard"><div class="qdate">Q3 — Sep 15</div><div class="qamt">${c$(totalTax/4)}</div></div>
      <div class="qcard"><div class="qdate">Q4 — Jan 15</div><div class="qamt">${c$(totalTax/4)}</div></div>
    </div>
    <div class="dsec" style="margin-top:12px">Schedule C numbers</div>
    <div class="srow"><span class="sl">Gross SE income (incl. tips)</span><span class="sv">${c$(totalInc)}</span></div>
    <div class="srow"><span class="sl">Total deductible expenses</span><span class="sv val-g">${c$(totalDed)}</span></div>
    <div class="srow"><span class="sl">Net profit (Sch. C line 31)</span><span class="sv">${c$(totalInc-totalDed)}</span></div>
    <div class="srow"><span class="sl">½ SE tax deduction (Form 1040)</span><span class="sv val-g">${c$(seTax*0.5)}</span></div>
    <div class="srow"><span class="sl">SE tax owed (Schedule SE)</span><span class="sv val-r">${c$(seTax)}</span></div>
    <div class="callout c-warn" style="margin-top:12px;font-size:12px">

            ${r.trueHourly!=null ? `<div class="ghr ${r.trueHourly>=0?'val-g':'val-r'}">${c$(r.trueHourly)}/hr true</div>` : ''}
          </div>
        </div>`;
      }).join('')}</div>`;

  document.getElementById('mc').innerHTML =
    hero +
    accSection('taxes',    'Tax details',       c$(totalTax)+' est.', taxBody) +
    accSection('expenses', 'Expense breakdown', c$(allCosts)+' total', expBody) +

function locCardHTML(l) {
  if (editingLocId === l.id) {
    return `<div class="card editing">
      <label>Name</label>
      <input type="text" id="el-name-${l.id}" value="${esc(l.name)}">
      <label>Address</label>
      <input type="text" id="el-address-${l.id}" value="${esc(l.address||'')}">
      <label>Default miles driven</label>
      <input type="number" id="el-miles-${l.id}" inputmode="decimal" value="${esc(l.miles||'')}" step="0.1">
      <div class="card-acts">
        <button class="abt abt-edit" onclick="saveLocEdit('${l.id}')">Save</button>
        <button class="abt" onclick="cancelLocEdit()">Cancel</button>
      </div>
    </div>`;
  }
  return `<div class="card">
    <div class="card-hdr">
      <div style="min-width:0">
        <div class="card-name">${esc(l.name)}</div>
        ${l.address ? `<div class="card-date">${mapsLinkHTML(l.address)}</div>` : ''}
      </div>
      ${l.miles ? `<span class="card-amt" style="font-size:14px">${l.miles} mi</span>` : ''}
    </div>
    <div class="card-acts">
      <button class="abt abt-edit" onclick="startEditLoc('${l.id}')">Edit</button>
      <button class="abt abt-del" onclick="deleteLocation('${l.id}')">Delete</button>
    </div>
  </div>`;
}

function startEditLoc(id) { editingLocId = id; renderLocations(); }
function cancelLocEdit()  { editingLocId = null; renderLocations(); }

async function saveLocEdit(id) {
  const name = (document.getElementById(`el-name-${id}`).value || '').trim();
  if (!name) { alert('Location name is required.'); return; }
  const address = document.getElementById(`el-address-${id}`).value || '';
  const miles   = parseFloat(document.getElementById(`el-miles-${id}`).value) || 0;
  const existing = savedLocations.find(l => l.id === id) || {id, createdAt: new Date().toISOString()};
  await locSave({...existing, name, address, miles});
  editingLocId = null;
  renderLocations();
}

async function deleteLocation(id) {
  if (!confirm('Delete this saved location? Past records that used it are not affected.')) return;
  await iDelete('locations', id);
  await loadSavedLocations();
  renderLocations();
}

async function addLocationFromScreen() {
  const name = (document.getElementById('nl-name').value || '').trim();
  if (!name) { alert('Enter a location name.'); return; }
  const address = document.getElementById('nl-address').value || '';
  const miles   = parseFloat(document.getElementById('nl-miles').value) || 0;
  await locSave({id: newId(), name, address, miles, createdAt: new Date().toISOString()});
  renderLocations();
}

async function exportCSV() {
  const recs = await recsGetAll();
  if (recs.length === 0) { alert('No records to export.'); return; }

  const hdr = ['Date','Pay Date','Type','Description','Location Name','Address','Base Pay','Tips','Tips In Tax','Total Income',
    'Hours','Rate ($/hr)','Miles','IRS Ded','Room Rental','Meal','Other',
    'Total Costs','Total Ded','Tax Savings','SE Tax','Income Tax','Net After All',
    'True Hourly','Payment Method','Notes'];

  const rows = [hdr.join(',')];
  for (const r of recs) {
    const ti = (r.amount||0) + (r.tips||0);
    rows.push([
      r.date, r.payDate, r.type,
      `"${(r.desc||'').replace(/"/g,'""')}"`,
      `"${(r.locationName||'').replace(/"/g,'""')}"`,
      `"${(r.address||'').replace(/"/g,'""')}"`,
      (r.amount||0).toFixed(2), (r.tips||0).toFixed(2),
      r.tipsInTax ? 'yes' : 'no', ti.toFixed(2),
      (r.hours||0).toFixed(2),
      r.grossHourly!=null ? r.grossHourly.toFixed(2) : '',
      (r.miles||0).toFixed(1), (r.irsDed||0).toFixed(2),
      (r.room||0).toFixed(2), (r.meal||0).toFixed(2), (r.oth||0).toFixed(2),
      (r.trueCosts||0).toFixed(2), (r.totalDed||0).toFixed(2),
      (r.taxSavings||0).toFixed(2), (r.seTax||0).toFixed(2),
      (r.incomeTax||0).toFixed(2), (r.netAfterAll||0).toFixed(2),
      r.trueHourly!=null ? r.trueHourly.toFixed(2) : '',
      `"${(r.payMethod||'').replace(/"/g,'""')}"`,
      `"${(r.notes||'').replace(/"/g,'""')}"`
    ].join(','));
  }

  const csv  = rows.join('\n');
  const name = `gigs_${new Date().toISOString().split('T')[0]}.csv`;
  await shareOrDownload(new Blob([csv], {type:'text/csv'}), name, 'text/csv');
  await kvSet('lastBackupAt', new Date().toISOString());
  updateBackupDot();
}

async function exportJSON() {
  const recs = await recsGetAll();
  const locs = await iAll('locations');
  const payload = {
    exportedAt: new Date().toISOString(),
    appVersion: '2.1',
    taxConfig: cfg,
    records: recs,
    locations: locs,
  };
  const name = `gigtracker_backup_${new Date().toISOString().split('T')[0]}.json`;
  await shareOrDownload(
    new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'}),
    name, 'application/json'
  );
  await kvSet('lastBackupAt', new Date().toISOString());
  updateBackupDot();
}

async function shareOrDownload(blob, filename, type) {
  // Use native share sheet on mobile if available
  if (navigator.share && navigator.canShare) {
    try {
      const file = new File([blob], filename, {type});
      if (navigator.canShare({files:[file]})) {
        await navigator.share({files:[file], title:'GigTracker Export'});
        return;
      }
    } catch (e) {
      if (e.name === 'AbortError') return; // user cancelled
    }
  }
  // Fallback: direct download
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  URL.revokeObjectURL(a.href);
}

async function importJSON(input) {
  const file = input.files[0];
  if (!file) return;
  try {
    const text = await file.text();
    const data = JSON.parse(text);
    const recs = data.records || data; // support both wrapped and raw array formats
    if (!Array.isArray(recs)) throw new Error('Invalid backup format');

    let imported = 0, skipped = 0;
    for (const r of recs) {
      if (!r.id || !r.type) { skipped++; continue; }
      const existing = await iGet('recs', r.id);
      // Newer record wins; if equal timestamps, incoming wins (restore behavior)
      if (!existing || (r.updatedAt||'') >= (existing.updatedAt||'')) {
        await iPut('recs', {...r, synced: true});
        imported++;
      } else {
        skipped++;
      }
    }

    let importedLocs = 0;
    const locs = Array.isArray(data.locations) ? data.locations : [];
    for (const l of locs) {
      if (!l.id || !l.name) continue;
      const existing = await iGet('locations', l.id);
      if (!existing || (l.updatedAt||'') >= (existing.updatedAt||'')) {
        await iPut('locations', l);
        importedLocs++;
      }
    }
    await loadSavedLocations();

    await kvSet('lastBackupAt', new Date().toISOString());
    updateBackupDot();
    alert(`Restored ${imported} records${importedLocs ? `, ${importedLocs} saved locations` : ''}. ${skipped} record(s) skipped (already up to date).`);
    closeSettings();
  } catch (e) {
    alert('Import failed: ' + e.message);
  }
  input.value = '';
}

function switchTab(t) {
  if (activeTab === 'add' && editId && t !== 'add') {
    if (!confirm('Cancel editing this record?')) return;
    cancelEdit(false);
  }
  activeTab = t; render();
}
function openSettings()  { inSettings = true;  render(); }
function closeSettings() { inSettings = false; render(); }
function setType(t)      { f.type = t; render(); }
function chk(k)          { f[k] = !f[k]; render(); }
function setFilter(ft)   { logFilter = ft; renderLog(); }
function toggleExp(id)   { expandedId = expandedId === id ? null : id; renderLog(); }

async function startEdit(id) {
  const rec = await iGet('recs', id);
  if (!rec) return;
  editId = id;
  f = {
    date:      rec.date     || '',
    payDate:   rec.payDate  || '',
    type:      rec.type     || 'income',
    desc:      rec.desc     || '',
    amount:    rec.amount   != null ? String(rec.amount)   : '',
    payMethod: rec.payMethod|| '',
    locationName: rec.locationName || '',
    address:      rec.address      || '',
    notes:     rec.notes    || '',
    start:     rec.start    || '',
    end:       rec.end      || '',
    hasToll:   !!rec.hasToll,  tollCost:  rec.tollCost  != null ? String(rec.tollCost)  : '',
    hasMeal:   !!rec.hasMeal,  mealCost:  rec.mealCost  != null ? String(rec.mealCost)  : '',
    hasOther:  !!rec.hasOther, otherDesc: rec.otherDesc || '', otherCost: rec.otherCost != null ? String(rec.otherCost) : '',
    hasRoom:   !!rec.hasRoom,  roomCost:  rec.roomCost  != null ? String(rec.roomCost)  : '',
    hasTips:   !!rec.hasTips,  tipsAmount:rec.tipsAmount!= null ? String(rec.tipsAmount): '', tipsInTax: rec.tipsInTax !== false,
    miles:     rec.miles    != null ? String(rec.miles)    : '',
    gasPrice:  rec.gasPrice != null ? String(rec.gasPrice) : '',
  };
  activeTab = 'add'; render();
  document.getElementById('mc').scrollTop = 0;
}

function cancelEdit(doRender = true) {
  editId = null; f = emptyForm(); f.date = todayStr();
  if (doRender) { activeTab = 'log'; render(); }
}

async function saveRec() {
  if (!f.desc.trim()) { alert('Please enter a description.'); return; }
  const p   = calc(f, cfg);
  const now = new Date().toISOString();
  const data = {
    date:      f.date || todayStr(),
    payDate:   f.payDate,
    type:      f.type,
    desc:      f.desc,
    amount:    parseFloat(f.amount)    || 0,
    payMethod: f.payMethod,
    locationName: f.locationName || '',
    address:      f.address      || '',
    notes:     f.notes,
    start:     f.start,
    end:       f.end,
    hasToll:   f.hasToll,   tollCost:  f.hasToll  ? parseFloat(f.tollCost)  || 0 : 0,
    hasMeal:   f.hasMeal,   mealCost:  f.hasMeal  ? parseFloat(f.mealCost)  || 0 : 0,
    hasOther:  f.hasOther,  otherDesc: f.otherDesc, otherCost: f.hasOther ? parseFloat(f.otherCost)||0 : 0,
    hasRoom:   f.hasRoom,   roomCost:  f.hasRoom  ? parseFloat(f.roomCost)  || 0 : 0,
    hasTips:   f.hasTips,   tipsAmount:f.hasTips  ? parseFloat(f.tipsAmount)|| 0 : 0, tipsInTax: f.tipsInTax !== false,
    miles:     parseFloat(f.miles)    || 0,
    gasPrice:  parseFloat(f.gasPrice) || 0,
    // Calculated fields stored alongside raw data
    hours:         p.hours,
    fuelCost:      p.fuelCost,
    trueCostMiles: p.trueCostMiles,
    irsDed:        p.irsDed,
    dedMeals:      p.dedMeals,
    totalDed:      p.totalDed,
    taxSavings:    p.taxSavings,
    trueCosts:     p.trueCosts,
    seTax:         p.seTax,
    incomeTax:     p.incomeTax,
    totalTax:      p.totalTax,
    netAfterAll:   p.netAfterAll,
    trueHourly:    p.trueHourly,
    grossHourly:   p.grossHourly,
    toll:          p.toll,
    meal:          p.meal,
    oth:           p.oth,
    room:          p.room,
    tips:          p.tips,
    deleted:       false,
  };

  if (editId) {
    const ex = await iGet('recs', editId);
    await recSave({...ex, ...data, id: editId, createdAt: ex?.createdAt || now});
    editId = null;
  } else {
    await recSave({...data, id: newId(), createdAt: now});
  }

  f = emptyForm(); f.date = todayStr();
  activeTab = 'log';
  render();
}

async function doDelete(id) {
  if (!confirm('Delete this record? This cannot be undone.')) return;
  if (editId === id) { editId = null; f = emptyForm(); f.date = todayStr(); }
  await recMarkDeleted(id);
  expandedId = null;
  renderLog();
}

async function saveCfg() {
  const get = id => parseFloat(document.getElementById(id).value) || 0;
  cfg = {
    federalRate:  get('s-fed') || 24,
    stateRate:    get('s-sta'),
    irsRate:      get('s-irs') || 0.725,
    trueCostRate: get('s-tru') || 0.50,
    mpg:          get('s-mpg') || 28,
  };
  await kvSet('appSettings', cfg);
  closeSettings();
}

// ═══════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════
async function init() {
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
    let refreshed = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (refreshed) return;
      refreshed = true;
      location.reload();
    });
  }
  f.date = todayStr();
  const savedCfg = await kvGet('appSettings');
  if (savedCfg) cfg = {...cfg, ...savedCfg};
  await loadSavedLocations();
  await updateBackupDot();
  await render();
}

init().catch(err => {
  document.getElementById('mc').innerHTML =
    `<div class="empty">Failed to start: ${esc(err.message)}<br>Try refreshing the page.</div>`;
  console.error(err);
});
</script>
</body>
</html>
