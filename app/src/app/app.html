<div class="topbar">
  <span class="topbar-title">🎸 GigTracker 2026</span>
</div>

<nav class="tabbar">
  <button
    type="button"
    class="tab"
    data-tab="log"
    [class.active]="activeTab() === 'log'"
    (click)="selectTab('log')"
  >
    Log
  </button>
  <button
    type="button"
    class="tab"
    data-tab="summary"
    [class.active]="activeTab() === 'summary'"
    (click)="selectTab('summary')"
  >
    Summary
  </button>
</nav>

<main class="content">
  @if (activeTab() === 'log') {
    <app-log />
  } @else {
    <app-summary />
  }
</main>
